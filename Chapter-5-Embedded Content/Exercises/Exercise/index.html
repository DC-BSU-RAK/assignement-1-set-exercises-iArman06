<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Document</title>
</head>
<body bgcolor="sky blue">
    <!--Title of the video-->
    <h1><center>Lukas Graham - 7 Years</center></h1>

    <hr> <!--adding a horizontal line-->

    <!--adding the video using the video tag-->
    <center>    <!--the video stays at the center-->

        <!--the video loops because of the loop attribute inside video tag-->
        <video controls loop src="song.mp4" height="250" width="400"></video>
    
        <br>    <!--adding a break in line so the image stays below the video-->

     <!--adding a relevant poster image for the song which I have added above-->
        <img src="https://i.pinimg.com/736x/15/5a/81/155a81ce62cc72e37328113f12696c9a.jpg" height="700" alt="Poster for Lukas Graham - 7 Years song" title="Song Poster">
    </center>
</body>
</html>
